<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>لوحة تحكّم Track</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login">
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="brand-word">Track</span><span class="brand-sub">لوحة التحكّم</span></div>
    <label for="pw">كلمة المرور</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" required>
    <button class="btn" type="submit">دخول</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </form>
</section>

<!-- EDITOR -->
<main class="editor" id="editor" hidden>
  <header class="ed-head">
    <div class="brand"><span class="brand-word">Track</span><span class="brand-sub">تحرير المحتوى</span></div>
    <div class="ed-actions">
      <a class="btn btn-ghost" href="../index.html" target="_blank" rel="noopener">معاينة الموقع ↗</a>
      <button class="btn" id="saveBtn" type="button">حفظ التغييرات</button>
      <button class="btn btn-ghost" id="logoutBtn" type="button">خروج</button>
    </div>
  </header>
  <p class="msg" id="saveMsg" role="status"></p>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="texts" type="button">النصوص</button>
    <button class="tab" data-tab="soon" type="button" disabled>الأعمال · الخدمات · الآراء (قريبًا)</button>
  </nav>

  <section class="panel" id="panel-texts">
    <div class="grid">

      <fieldset><legend>خلفية الهيرو (فيديو)</legend>
        <div class="field wide">
          <label>فيديو الهيرو — عند رفعه يظهر بدل صور الخلفية (mp4 أو webm، حتى 80MB)</label>
          <input type="file" id="heroVideoFile" accept="video/mp4,video/webm">
          <div class="row">
            <button type="button" class="btn btn-ghost" id="heroVideoUpload">رفع الفيديو</button>
            <button type="button" class="btn btn-ghost" id="heroVideoClear">إزالة (رجوع للصور)</button>
          </div>
          <p class="msg" id="heroVideoStatus"></p>
          <p class="hint">الحالي: <span id="heroVideoCurrent" dir="ltr">لا يوجد (صور)</span></p>
        </div>
      </fieldset>

      <fieldset><legend>صور الهيرو (تتبدّل بالتلاشي إن لم يوجد فيديو)</legend>
        <div class="field"><label>الصورة ١</label>
          <img class="thumb" id="slideThumb0" alt="">
          <input type="file" id="slideFile0" accept="image/*">
          <button type="button" class="btn btn-ghost" data-slide="0">رفع الصورة ١</button>
        </div>
        <div class="field"><label>الصورة ٢</label>
          <img class="thumb" id="slideThumb1" alt="">
          <input type="file" id="slideFile1" accept="image/*">
          <button type="button" class="btn btn-ghost" data-slide="1">رفع الصورة ٢</button>
        </div>
        <div class="field"><label>الصورة ٣</label>
          <img class="thumb" id="slideThumb2" alt="">
          <input type="file" id="slideFile2" accept="image/*">
          <button type="button" class="btn btn-ghost" data-slide="2">رفع الصورة ٣</button>
        </div>
        <p class="msg wide" id="slideStatus"></p>
      </fieldset>

      <fieldset><legend>الهيرو (الواجهة)</legend>
        <div class="field"><label>الشريط العلوي — عربي</label><input id="f_heroEyebrow_ar"></div>
        <div class="field"><label>الشريط العلوي — إنجليزي</label><input id="f_heroEyebrow_en" dir="ltr"></div>
        <div class="field"><label>العنوان (سطر ١) — عربي</label><input id="f_heroTitle1_ar"></div>
        <div class="field"><label>العنوان (سطر ١) — إنجليزي</label><input id="f_heroTitle1_en" dir="ltr"></div>
        <div class="field"><label>العنوان (سطر ٢، يسمح بـ &lt;em&gt;) — عربي</label><input id="f_heroTitle2Html_ar"></div>
        <div class="field"><label>العنوان (سطر ٢) — إنجليزي</label><input id="f_heroTitle2Html_en" dir="ltr"></div>
        <div class="field wide"><label>الوصف — عربي</label><textarea id="f_heroSub_ar" rows="2"></textarea></div>
        <div class="field wide"><label>الوصف — إنجليزي</label><textarea id="f_heroSub_en" rows="2" dir="ltr"></textarea></div>
      </fieldset>

      <fieldset><legend>من نحن</legend>
        <div class="field wide"><label>العنوان (يسمح بـ &lt;em&gt;) — عربي</label><input id="f_aboutHeadingHtml_ar"></div>
        <div class="field wide"><label>العنوان — إنجليزي</label><input id="f_aboutHeadingHtml_en" dir="ltr"></div>
        <div class="field wide"><label>الفقرة الأولى — عربي</label><textarea id="f_aboutLead_ar" rows="3"></textarea></div>
        <div class="field wide"><label>الفقرة الأولى — إنجليزي</label><textarea id="f_aboutLead_en" rows="3" dir="ltr"></textarea></div>
        <div class="field wide"><label>الفقرة الثانية — عربي</label><textarea id="f_aboutBody_ar" rows="3"></textarea></div>
        <div class="field wide"><label>الفقرة الثانية — إنجليزي</label><textarea id="f_aboutBody_en" rows="3" dir="ltr"></textarea></div>
      </fieldset>

      <fieldset><legend>التواصل</legend>
        <div class="field"><label>البريد الإلكتروني</label><input id="f_email" dir="ltr"></div>
        <div class="field"><label>الهاتف</label><input id="f_phone" dir="ltr"></div>
        <div class="field"><label>العنوان — عربي</label><input id="f_address_ar"></div>
        <div class="field"><label>العنوان — إنجليزي</label><input id="f_address_en" dir="ltr"></div>
      </fieldset>

      <fieldset><legend>عناصر عامة</legend>
        <div class="field"><label>شعار الفرع (tag) — عربي</label><input id="f_brandTag_ar"></div>
        <div class="field"><label>شعار الفرع (tag) — إنجليزي</label><input id="f_brandTag_en" dir="ltr"></div>
        <div class="field"><label>جملة التذييل — عربي</label><input id="f_footerTag_ar"></div>
        <div class="field"><label>جملة التذييل — إنجليزي</label><input id="f_footerTag_en" dir="ltr"></div>
      </fieldset>

    </div>
  </section>
</main>

<script src="admin.js"></script>
</body>
</html>
